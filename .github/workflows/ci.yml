name: CI

on:
  push:
    branches: [main]
    paths:
      - grammar.js
      - src/**
      - test/**
      - tests/**
      - demo/**
      - queries/**
      - bindings/**
      - binding.gyp
      - pyproject.toml
      - justfile
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - tests/**
      - demo/**
      - queries/**
      - bindings/**
      - binding.gyp
      - pyproject.toml
      - justfile
      - .github/workflows/ci.yml

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  # The parser jobs below prove the grammar parses. This one proves the
  # lowered output runs, which is the only thing that makes this package a
  # preparser rather than a syntax highlighter. It needs real Sage: the
  # suite has no skips, and sageparse installs over `sage.repl.preparse`,
  # so a fork or a partial install would test something else.
  sage:
    name: Test preparser under Sage
    runs-on: ubuntu-latest
    container: sagemath/sagemath:10.10.beta8
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the package into Sage's Python
        # Editable so the finder maps `sageparse` at src/, matching how the
        # local gate and every consumer install it.
        run: |-
          sage -pip install --no-build-isolation -e .
          sage -pip install pytest
      - name: Run the suite in a Sage session
        # `sage -python` is Sage's interpreter, not a session: sage.all is
        # absent there and Sage's own library assumes it. `sage -c` cannot
        # carry arguments, so import it explicitly -- same reasoning as the
        # `_sage-pytest` QC recipe.
        run: sage -python -c "import sage.all, sys, pytest; sys.exit(pytest.main(['tests/', '-q']))"

  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@1868a545ffb91bdc221d14a168b5b6d8de4a28b3 # v2
        with:
          # Must match the toolchain that generated the committed parser;
          # the parser-test action regenerates and diffs against src/.
          tree-sitter-ref: v0.26.9
      - name: Run tests
        uses: tree-sitter/parser-test-action@aba4a3de737f86f8ce83be38166a1ab521d4c960 # v2
        with:
          test-rust: true
          test-node: true
          test-python: true
          # The Python bindings declare requires-python >=3.14; the
          # action's default interpreter is older.
          python-version: '3.14'
          test-go: true
          # The macos runner image's Xcode 26.6 cannot build the Swift
          # stdlib modulemaps (toolchain breakage, not this grammar);
          # no Swift consumer exists — re-enable when the image heals.
          test-swift: false
      - name: Set up examples
        run: |-
          git clone https://github.com/numpy/numpy examples/numpy --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/django/django examples/django --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/pallets/flask examples/flask --single-branch --depth=1 --filter=blob:none
          git clone https://github.com/python/cpython examples/cpython --single-branch --depth=1 --filter=blob:none
      - name: Parse examples
        uses: tree-sitter/parse-action@f44ffa94f802024f27e821a72e6f2f3efc5dd521 # v4
        with:
          files: |
            examples/**/*.py
            !examples/cpython/Lib/test/test_annotationlib.py
            !examples/cpython/Lib/test/test_compile.py
            !examples/cpython/Lib/test/test_type_params.py
            # cpython main newer than the grammar: PEP 810 lazy imports
            # (stdlib + test corpus) and unary-plus case patterns.
            !examples/cpython/Lib/concurrent/futures/__init__.py
            !examples/cpython/Lib/test/test_lazy_import/**
            !examples/cpython/Lib/test/test_patma.py
            !examples/cpython/Lib/xml/utils.py
          invalid-files: |
            examples/cpython/Lib/test/tokenizedata/badsyntax_3131.py
