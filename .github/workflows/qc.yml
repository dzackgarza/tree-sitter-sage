# Remote acceptance tier (just test-ci), the same reusable workflow every
# other repo on this QC contract calls. Local pre-commit and pre-push hooks
# own test-commit and test-push.
name: QC

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  qc-ci:
    uses: dzackgarza/ai-review-ci/.github/workflows/_qc.yml@main
    permissions:
      contents: read
      issues: read
    with:
      tier: test-ci
      profile: sage
      # Sage is not on a runner and the sage profile installs nothing --
      # it only asserts SAGE_BIN. This recipe is what provides it.
      setup_recipe: ci-provision-sage
